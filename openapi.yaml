openapi: 3.1.0
info:
  title: Ticketing System API
  version: 1.0.0
  description: |
    REST API for the Ticketing System — a microservices-based event ticketing platform.

    All requests are made through the **API Gateway** at `http://localhost:8000`.
    The gateway handles JWT verification and forwards requests to the appropriate
    downstream service.

    ## Authentication
    Protected endpoints require a JWT bearer token obtained from `POST /auth/login`.
    Include it in the `Authorization` header:
    ```
    Authorization: Bearer <access_token>
    ```

    ## Services
    | Tag | Upstream Service | Description |
    |-----|-----------------|-------------|
    | auth | auth-service | User registration, login, token verification |
    | booking | booking-service | Events, venues, seat reservations, payments |
    | status | booking-status-service | Reservation and booking queries |
    | payment | payment-mock | Mock payment provider (testing only) |

servers:
  - url: http://localhost:8000
    description: Local development (API Gateway)

security: []

tags:
  - name: auth
    description: User authentication and JWT token management
  - name: booking
    description: Events, venues, seat reservation, and payment capture
  - name: status
    description: Reservation and confirmed booking queries (all require authentication)
  - name: payment
    description: Mock payment provider endpoints — for testing only; not for production use
  - name: system
    description: Gateway health and info

paths:

  # ─────────────────────────────────────────────────────────────
  # System
  # ─────────────────────────────────────────────────────────────

  /:
    get:
      tags: [system]
      summary: Gateway info
      description: Returns API Gateway metadata and available route prefixes.
      operationId: getGatewayInfo
      security: []
      responses:
        "200":
          description: Gateway information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayInfo"

  /health:
    get:
      tags: [system]
      summary: Health check
      description: Returns the current health status of the API Gateway.
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ─────────────────────────────────────────────────────────────
  # Auth
  # ─────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: Create a new user account with email and password.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: user@example.com
              password: securepassword123
              full_name: Jane Doe
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Email already registered

  /auth/login:
    post:
      tags: [auth]
      summary: Login
      description: Authenticate with email and password and receive a JWT access token.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: user@example.com
              password: securepassword123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Invalid credentials

  /auth/verify:
    post:
      tags: [auth]
      summary: Verify JWT token
      description: Validate a JWT access token and return the associated user information.
      operationId: verifyToken
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "401":
          description: Token is missing, expired, or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Token has expired

  # ─────────────────────────────────────────────────────────────
  # Booking — Venues
  # ─────────────────────────────────────────────────────────────

  /booking/venues:
    get:
      tags: [booking]
      summary: List all venues
      description: Return a list of all configured venues. Public endpoint — no authentication required.
      operationId: listVenues
      security: []
      responses:
        "200":
          description: List of venues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueList"

  /booking/venues/{venue_name}:
    get:
      tags: [booking]
      summary: Get venue details
      description: Return the seating layout and pricing configuration for a single venue. Public endpoint.
      operationId: getVenue
      security: []
      parameters:
        - in: path
          name: venue_name
          required: true
          schema:
            type: string
          description: Name of the venue.
          example: "Sample Stadium"
      responses:
        "200":
          description: Venue details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueDetails"
        "404":
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Venue not found

  # ─────────────────────────────────────────────────────────────
  # Booking — Events
  # ─────────────────────────────────────────────────────────────

  /booking/events:
    get:
      tags: [booking]
      summary: List all events
      description: Return a list of all events with minimal metadata. Public endpoint — no authentication required.
      operationId: listEvents
      security: []
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
    post:
      tags: [booking]
      summary: Create an event
      description: |
        Create a new event and pre-populate its seats from the venue configuration.

        **Requires authentication.**
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
            example:
              name: "Rock Concert 2026"
              venue: "Sample Stadium"
              start_time: "2026-06-15T19:00:00"
      responses:
        "201":
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEventResponse"
        "400":
          description: Unknown venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Unknown venue
        "401":
          description: Missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /booking/events/{event_id}:
    get:
      tags: [booking]
      summary: Get event details
      description: |
        Retrieve full event metadata including the venue seating layout,
        current seat availability, and per-seat pricing. This is a **public**
        endpoint — no authentication is required.

        The `seat_arrangements` array represents rows of seat IDs ordered from
        front to back. `seat_availability_map` maps each seat ID to `0` (available)
        or `1` (occupied/reserved). `seat_price_map` maps each seat ID to its price.
      operationId: getEvent
      security: []
      parameters:
        - $ref: "#/components/parameters/eventIdPath"
      responses:
        "200":
          description: Event details with seating layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetails"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Event not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /booking/events/{event_id}/close:
    get:
      tags: [booking]
      summary: Close an event
      description: |
        Mark an event as closed so that no new reservations can be made.
        Any outstanding `reserved` reservations are expired and their seats freed.

        **Requires authentication.**
      operationId: closeEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventIdPath"
      responses:
        "200":
          description: Event closed (or was already closed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseEventResponse"
        "401":
          description: Missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Event not found

  # ─────────────────────────────────────────────────────────────
  # Booking — Reservations
  # ─────────────────────────────────────────────────────────────

  /booking/bookings/reserve:
    post:
      tags: [booking]
      summary: Reserve seats
      description: |
        Reserve one or more specific seats for an event.

        The caller must supply the exact seat IDs to reserve (e.g. `["A1", "B3"]`).
        Seat IDs are case-insensitive and are normalised to upper-case internally
        (e.g. `"a1"` → `"A1"`).

        Seats are held in Redis for the duration of the reservation TTL. If payment
        is not captured before `expires_at`, the hold is released automatically.

        An optional `Idempotency-Key` header may be provided to safely retry the
        request without creating duplicate reservations.

        **Requires authentication.**
      operationId: reserveSeats
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: false
          description: |
            Client-generated unique key for idempotent retries. Repeating the
            same key returns the original reservation without creating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveRequest"
            example:
              event_id: "evt-abc123"
              selected_seats: ["A1", "A2", "A3"]
      responses:
        "201":
          description: Seats reserved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReserveResponse"
        "400":
          description: Invalid request — empty seat list, invalid seat ID, or duplicate seats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emptySeats:
                  summary: No seats provided
                  value:
                    detail: selected_seats must not be empty
                invalidSeatId:
                  summary: Malformed seat ID
                  value:
                    detail: "Invalid seat id: XY"
        "401":
          description: Missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Authentication required
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Event not found
        "409":
          description: One or more requested seats are already occupied, or the event is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                seatsUnavailable:
                  summary: Seats already taken
                  value:
                    detail: Seats unavailable
                eventClosed:
                  summary: Event is closed
                  value:
                    detail: Event is closed

  # ─────────────────────────────────────────────────────────────
  # Booking — Payments
  # ─────────────────────────────────────────────────────────────

  /booking/payments/capture:
    post:
      tags: [booking]
      summary: Capture payment for a reservation
      description: |
        Forward a payment capture request to the payment provider.

        The `intent_id` must be a reservation UUID previously obtained from
        `POST /booking/bookings/reserve`. The booking service proxies this
        request to the configured payment provider and returns the provider's
        response.

        An optional `Idempotency-Key` header may be forwarded to the payment
        provider to prevent double charges on retries.

        **Requires authentication.**
      operationId: capturePayment
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: false
          description: Forwarded to the payment provider for idempotent retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCaptureRequest"
            example:
              intent_id: "a3f1c2d4-5678-90ab-cdef-1234567890ab"
              amount: 150.00
              currency: "USD"
      responses:
        "200":
          description: Payment intent created at the provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResponse"
        "401":
          description: Missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Authentication required
        "402":
          description: Payment declined (card refused, insufficient funds, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment provider is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /booking/payments/webhook:
    post:
      tags: [booking]
      summary: Payment provider webhook
      description: |
        Internal endpoint that receives signed webhook callbacks from the payment
        provider after a capture attempt completes.

        On `capture_succeeded` the booking service creates a confirmed booking
        record and enqueues a payment confirmation notification email.

        On `capture_failed` a payment failure notification email is enqueued.

        > **Note:** This endpoint is called by the payment provider, not by the
        > frontend. Do not call it directly.
      operationId: paymentWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Webhook received and processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: Missing or invalid webhook payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: invalid webhook

  # ─────────────────────────────────────────────────────────────
  # Booking Status
  # ─────────────────────────────────────────────────────────────

  /status/bookings/{booking_id}:
    get:
      tags: [status]
      summary: Get confirmed booking details
      description: |
        Retrieve the details of a confirmed booking. A booking is created
        automatically when a payment capture succeeds (via webhook).

        Only the authenticated user who owns the booking may view it.

        **Requires authentication.**
      operationId: getBookingDetails
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/bookingIdPath"
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDetails"
        "401":
          description: Missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated user does not own this booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Access denied
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Booking not found

  /status/user/bookings:
    get:
      tags: [status]
      summary: Get current user's bookings
      description: |
        Return a paginated list of all bookings belonging to the authenticated user,
        sorted by creation date descending (most recent first).

        **Requires authentication.**
      operationId: getUserBookings
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
          required: false
          description: Maximum number of bookings to return.
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
          required: false
          description: Pagination offset (number of records to skip).
      responses:
        "200":
          description: Paginated list of user bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBookingsResponse"
        "401":
          description: Missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────────────────────
  # Payment Mock (testing only)
  # ─────────────────────────────────────────────────────────────

  /payment/intents:
    post:
      tags: [payment]
      summary: Create a payment intent
      description: |
        > **Testing only.** In production this endpoint belongs to the real
        > payment provider and is never called directly by clients.

        Create a new payment intent. The caller must supply a caller-generated
        `intent_id` (typically the `reservation_id`). Idempotency is supported
        via the `Idempotency-Key` header.
      operationId: createPaymentIntent
      security: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: false
          description: Client-generated unique key to prevent duplicate intents on retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntentRequest"
            example:
              intent_id: "a3f1c2d4-5678-90ab-cdef-1234567890ab"
              amount: 150.00
              currency: "USD"
      responses:
        "200":
          description: Payment intent created (or retrieved from idempotency cache)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResponse"
        "400":
          description: "`intent_id` is missing from the request body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: intent_id is required in payload

  /payment/intents/{intent_id}/confirm:
    get:
      tags: [payment]
      summary: Confirm (capture) a payment intent
      description: |
        > **Testing only.** In production this endpoint belongs to the real
        > payment provider and is never called directly by clients.

        Confirm and capture a previously created payment intent. The mock provider
        succeeds 90 % of the time and fails 10 % of the time to simulate
        real-world behaviour.

        After processing, the provider asynchronously delivers a signed webhook
        to `POST /booking/payments/webhook` with either `capture_succeeded` or
        `capture_failed`.
      operationId: confirmPaymentIntent
      security: []
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the payment intent to confirm.
      responses:
        "200":
          description: Confirmation scheduled; webhook will be delivered asynchronously
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  scheduled:
                    type: boolean
                    example: true

# ─────────────────────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from `POST /auth/login`.

  parameters:

    eventIdPath:
      in: path
      name: event_id
      required: true
      schema:
        type: string
      description: Unique identifier of the event.
      example: "evt-abc123"

    reservationIdPath:
      in: path
      name: reservation_id
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the reservation returned by `POST /booking/bookings/reserve`.

    bookingIdPath:
      in: path
      name: booking_id
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the confirmed booking.

  schemas:

    # ── System ──────────────────────────────────────────────────

    GatewayInfo:
      type: object
      properties:
        service:
          type: string
          example: API Gateway
        version:
          type: string
          example: "1.0.0"
        endpoints:
          type: object
          additionalProperties:
            type: string
          example:
            auth: /auth/*
            booking: /booking/*
            status: /status/*
            payment: /payment/*

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: api-gateway

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Human-readable error description.
          example: "Resource not found"

    # ── Auth ────────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          description: User's email address. Must be unique across the system.
          example: user@example.com
        password:
          type: string
          minLength: 8
          description: Plaintext password. Stored as a bcrypt hash.
          example: securepassword123
        full_name:
          type: string
          description: User's display name.
          example: Jane Doe

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: securepassword123

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Signed JWT access token.
          example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
        token_type:
          type: string
          enum: [bearer]
          example: bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds.
          example: 3600

    UserResponse:
      type: object
      required: [user_id, email, full_name, created_at]
      properties:
        user_id:
          type: string
          format: uuid
          description: Unique user identifier.
        email:
          type: string
          format: email
          example: user@example.com
        full_name:
          type: string
          example: Jane Doe
        created_at:
          type: string
          format: date-time
          example: "2026-02-07T12:00:00Z"

    VerifyResponse:
      type: object
      required: [valid, user_id, email, full_name]
      properties:
        valid:
          type: boolean
          example: true
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: user@example.com
        full_name:
          type: string
          example: Jane Doe

    # ── Booking ─────────────────────────────────────────────────

    EventDetails:
      type: object
      required: [event_id, name, start_time, venue, closed, seat_arrangements, seat_availability_map, seat_price_map]
      properties:
        event_id:
          type: string
          description: Unique event identifier.
          example: "evt-abc123"
        name:
          type: string
          description: Human-readable event name.
          example: "Rock Concert 2026"
        start_time:
          type: string
          format: date-time
          description: ISO 8601 event start timestamp.
          example: "2026-06-15T19:00:00"
        venue:
          type: string
          description: Name of the venue as configured on the booking service.
          example: "Sample Stadium"
        closed:
          type: integer
          enum: [0, 1]
          description: "`1` if the event has been closed and no new reservations are accepted; `0` otherwise."
          example: 0
        seat_arrangements:
          type: array
          description: |
            Two-dimensional array of seat IDs representing the venue layout.
            Outer array = rows (front to back), inner array = seats (left to right).
          items:
            type: array
            items:
              type: string
          example:
            - ["A1", "A2", "A3", "A4"]
            - ["B1", "B2", "B3", "B4"]
        seat_availability_map:
          type: object
          description: |
            Maps each seat ID to its availability status.
            `0` = available, `1` = occupied or reserved.
          additionalProperties:
            type: integer
            enum: [0, 1]
          example:
            A1: 0
            A2: 1
            A3: 0
            B1: 0
        seat_price_map:
          type: object
          description: Maps each seat ID to its price in the system's default currency.
          additionalProperties:
            type: number
          example:
            A1: 75.0
            A2: 75.0
            B1: 50.0

    ReserveRequest:
      type: object
      required: [event_id, selected_seats]
      properties:
        event_id:
          type: string
          description: ID of the event to reserve seats for.
          example: "evt-abc123"
        selected_seats:
          type: array
          minItems: 1
          description: |
            List of seat IDs to reserve (e.g. `["A1", "B3"]`).
            Seat IDs are case-insensitive and normalised to upper-case internally.
            Duplicate seat IDs are rejected with HTTP 400.
          items:
            type: string
          example: ["A1", "A2", "A3"]

    ReserveResponse:
      type: object
      required: [reservation_id, event_id, seats, expires_at, status]
      properties:
        reservation_id:
          type: string
          format: uuid
          description: Unique reservation identifier. Use this as `intent_id` when capturing payment.
        event_id:
          type: string
          example: "evt-abc123"
        seats:
          type: array
          description: Normalised seat IDs that were reserved.
          items:
            type: string
          example: ["A1", "A2", "A3"]
        expires_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the reservation expires if payment is not captured.
          example: "2026-02-07T12:10:00Z"
        status:
          type: string
          enum: [reserved]
          example: reserved

    PaymentCaptureRequest:
      type: object
      required: [intent_id]
      description: |
        Forwarded verbatim to the payment provider. The `intent_id` should be set
        to the `reservation_id` returned by `POST /booking/bookings/reserve`.
        Include `amount` and `currency` so the provider can record the charge.
      properties:
        intent_id:
          type: string
          format: uuid
          description: Reservation UUID used as the payment intent identifier.
          example: "a3f1c2d4-5678-90ab-cdef-1234567890ab"
        amount:
          type: number
          description: Amount to charge in the currency's major unit (e.g. dollars).
          example: 150.00
        currency:
          type: string
          description: ISO 4217 currency code.
          default: USD
          example: USD

    PaymentIntentResponse:
      type: object
      required: [intent_id, status]
      properties:
        intent_id:
          type: string
          format: uuid
          example: "a3f1c2d4-5678-90ab-cdef-1234567890ab"
        status:
          type: string
          enum: [requires_confirmation, pending, succeeded, failed]
          example: requires_confirmation
        amount:
          type: number
          nullable: true
          example: 150.00
        currency:
          type: string
          nullable: true
          example: USD

    WebhookPayload:
      type: object
      required: [event, intent_id]
      properties:
        event:
          type: string
          enum: [capture_succeeded, capture_failed]
          description: Outcome of the payment capture attempt.
          example: capture_succeeded
        payment_id:
          type: string
          format: uuid
          description: Unique ID for this capture attempt, assigned by the payment provider.
        intent_id:
          type: string
          format: uuid
          description: The `intent_id` / `reservation_id` this payment relates to.
        timestamp:
          type: integer
          description: Unix timestamp (seconds) of the capture attempt.
          example: 1739025600

    # ── Booking Status ───────────────────────────────────────────

    SeatInfo:
      type: object
      description: A seat included in a reservation or booking.
      properties:
        seat_id:
          type: string
          description: Seat identifier (e.g. `"A1"`).
          example: "A1"

    ReservationStatus:
      type: object
      required: [reservation_id, event_id, user_email, status, seats, created_at, updated_at]
      properties:
        reservation_id:
          type: string
          format: uuid
        event_id:
          type: string
          example: "evt-abc123"
        user_email:
          type: string
          format: email
          description: Email of the user who created the reservation.
          example: user@example.com
        status:
          type: string
          enum: [reserved, confirmed, expired, cancelled]
          description: Current lifecycle state of the reservation.
          example: reserved
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatInfo"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the reservation expires. `null` after it has been confirmed.
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: When the reservation was confirmed via payment. `null` if not yet confirmed.

    BookingDetails:
      type: object
      required: [booking_id, event_id, user_email, status, seats, payment_status, created_at, updated_at]
      properties:
        booking_id:
          type: string
          format: uuid
          description: Unique confirmed-booking identifier.
        event_id:
          type: string
          example: "evt-abc123"
        user_email:
          type: string
          format: email
          example: user@example.com
        status:
          type: string
          enum: [reserved, confirmed, expired, cancelled]
          example: confirmed
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatInfo"
        payment_status:
          type: string
          description: Status from the payment provider.
          example: completed
        total_amount:
          type: number
          nullable: true
          description: Total amount charged. `null` if not yet captured.
          example: 150.00
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Reservation expiry time. Populated while status is `reserved`.

    UserBookingsResponse:
      type: object
      required: [bookings, total]
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/BookingDetails"
        total:
          type: integer
          description: Total number of bookings for the user (before pagination).
          example: 3

    # ── Payment Mock ─────────────────────────────────────────────

    CreatePaymentIntentRequest:
      type: object
      required: [intent_id]
      properties:
        intent_id:
          type: string
          format: uuid
          description: Caller-generated unique identifier for the intent (typically the `reservation_id`).
          example: "a3f1c2d4-5678-90ab-cdef-1234567890ab"
        amount:
          type: number
          description: Amount to charge in the currency's major unit.
          example: 150.00
        currency:
          type: string
          description: ISO 4217 currency code.
          default: USD
          example: USD

    # ── Venues & Events (new) ────────────────────────────────────

    VenueList:
      type: object
      properties:
        venues:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "Sample Stadium"

    VenueDetails:
      type: object
      properties:
        name:
          type: string
          example: "Sample Stadium"
        rows:
          type: array
          items:
            type: string
          example: ["A", "B", "C", "D"]
        columns:
          type: array
          items:
            type: integer
          example: [1, 2, 3, 4, 5]
        seat_price:
          type: object
          description: Maps row letter to the price for all seats in that row.
          additionalProperties:
            type: number
          example:
            A: 75.0
            B: 50.0

    EventList:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            required: [event_id, name, venue, date, num_seats_available, list_of_prices]
            properties:
              event_id:
                type: string
                example: "evt-abc123"
              name:
                type: string
                example: "Rock Concert 2026"
              venue:
                type: string
                example: "Sample Stadium"
              date:
                type: string
                format: date
                example: "2026-06-15"
              num_seats_available:
                type: integer
                description: Number of unoccupied seats for this event.
                example: 142
              list_of_prices:
                type: array
                description: Distinct prices of currently available (unoccupied) seats, sorted ascending.
                items:
                  type: number
                  format: float
                example: [50.0, 75.0, 100.0]

    CreateEventRequest:
      type: object
      required: [name, venue, start_time]
      properties:
        name:
          type: string
          description: Human-readable event name.
          example: "Rock Concert 2026"
        venue:
          type: string
          description: Venue name as configured on the booking service.
          example: "Sample Stadium"
        start_time:
          type: string
          format: date-time
          description: ISO 8601 event start timestamp.
          example: "2026-06-15T19:00:00"

    CreateEventResponse:
      type: object
      required: [event_id]
      properties:
        event_id:
          type: string
          format: uuid
          description: Unique identifier of the newly created event.
          example: "a3f1c2d4-5678-90ab-cdef-1234567890ab"

    CloseEventResponse:
      type: object
      required: [event_id, status]
      properties:
        event_id:
          type: string
          example: "evt-abc123"
        status:
          type: string
          enum: [closed, already_closed]
          example: closed
