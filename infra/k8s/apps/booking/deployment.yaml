apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-system-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticketing-system-booking
  template:
    metadata:
      labels:
        app: ticketing-system-booking
    spec:
      containers:
        - name: booking
          image: booking:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: ticketing-system-credentials
            - configMapRef:
                name: ticketing-system-config
          env:
            - name: SERVICE_NAME
              value: booking
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
