apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-system-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticketing-system-gateway
  template:
    metadata:
      labels:
        app: ticketing-system-gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8001
              name: metrics
          envFrom:
            - configMapRef:
                name: ticketing-system-config
          env:
            - name: SERVICE_NAME
              value: gateway
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
