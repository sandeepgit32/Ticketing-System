# Grafana ConfigMaps for K8s deployment
# Three separate ConfigMaps:
#   1. grafana-datasources     — Prometheus / Loki / Tempo datasource definitions
#   2. grafana-dashboards-prov — Dashboard provider config (where to load dashboards from)
#   3. grafana-dashboards      — The four dashboard JSON files

# ── 1. Datasources ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: default
data:
  datasources.yaml: |-
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: '15s'
          httpMethod: POST

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        editable: true
        jsonData:
          maxLines: 1000
          derivedFields:
            - name: trace_id
              matcherRegex: '"trace_id"\s*:\s*"?([^",\s]+'
              url: 'http://localhost:3000/d/trace/${__value.raw}'
              datasourceUid: tempo
            - name: service
              matcherRegex: '"service"\s*:\s*"([^"]+'

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        isDefault: false
        editable: true
        jsonData:
          nodeGraphEnabled: true
          tracesToLogs:
            datasourceUid: loki
            mappedTag: 'trace_id'
            mappedField: 'trace_id'
            spanStartTimeShift: '0'
            spanEndTimeShift: '0'
            filterByTraceID: true
            filterBySpanID: false
          serviceMap:
            datasourceUid: prometheus

---
# ── 2. Dashboard provisioning config ────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-prov
  namespace: default
data:
  dashboards.yaml: |-
    apiVersion: 1
    providers:
      - name: 'TicketingSystemDashboards'
        orgId: 1
        folder: 'Ticketing System'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /etc/grafana/provisioning/dashboards

---
