apiVersion: v1
kind: Secret
metadata:
  name: ticketing-system-credentials
# This file is a TEMPLATE committed to version control.
# DO NOT put real secrets here.
#
# To create the real secret.yaml, run:
#   ./scripts/create-k8s-secret.sh
#
# Source values come from each service's .env file (copy from .env.example):
#   services/auth/.env          -> JWT_SECRET_KEY, DEFAULT_ADMIN_*, MYSQL_PASSWORD
#   services/database/.env      -> MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD
#   services/notification/.env  -> SMTP_USER, SMTP_PASSWORD
stringData:
  jwt-secret: "CHANGEME"                     # from services/auth/.env       -> JWT_SECRET_KEY
  mysql-root-password: "CHANGEME"            # from services/database/.env   -> MYSQL_ROOT_PASSWORD
  mysql-password: "CHANGEME"                 # from services/auth/.env       -> MYSQL_PASSWORD
  smtp-host: "smtp.example.com"              # from services/notification/.env -> SMTP_HOST
  smtp-port: "2525"                          # from services/notification/.env -> SMTP_PORT
  smtp-user: "CHANGEME"                      # from services/notification/.env -> SMTP_USER
  smtp-password: "CHANGEME"                  # from services/notification/.env -> SMTP_PASSWORD
  default-admin-email: "admin@example.com"   # from services/auth/.env       -> DEFAULT_ADMIN_EMAIL
  default-admin-password: "CHANGEME"         # from services/auth/.env       -> DEFAULT_ADMIN_PASSWORD
