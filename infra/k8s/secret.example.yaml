  SMTP_USER: "CHANGEME"                          # from services/notification/.env -> SMTP_USER
  SMTP_PASSWORD: "CHANGEME"                      # from services/notification/.env -> SMTP_PASSWORD
  DEFAULT_ADMIN_EMAIL: "admin@example.com"       # from services/auth/.env       -> DEFAULT_ADMIN_EMAIL
