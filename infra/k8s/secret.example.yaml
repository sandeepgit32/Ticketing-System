#   services/notification/.env  -> SMTP_USER, SMTP_PASSWORD
stringData:
  JWT_SECRET_KEY: "CHANGEME"                     # from services/auth/.env       -> JWT_SECRET_KEY
  MYSQL_ROOT_PASSWORD: "CHANGEME"                # from services/database/.env   -> MYSQL_ROOT_PASSWORD
  MYSQL_PASSWORD: "CHANGEME"                     # from services/auth/.env       -> MYSQL_PASSWORD
  SMTP_HOST: "smtp.example.com"                  # from services/notification/.env -> SMTP_HOST
