apiVersion: v1
kind: Secret
metadata:
  name: ticketing-system-credentials
# This file is a TEMPLATE committed to version control.
# DO NOT put real secrets here.
#
# To create the real secret.yaml, run:
#   ./scripts/create-k8s-secret.sh
#
# Source values come from each service's .env file (copy from .env.example):
