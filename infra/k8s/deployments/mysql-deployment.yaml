apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-system-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticketing-system-mysql
  template:
    metadata:
      labels:
        app: ticketing-system-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          envFrom:
            - secretRef:
                name: ticketing-system-credentials
            - configMapRef:
                name: ticketing-system-config
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: ticketing-system-mysql-pvc
