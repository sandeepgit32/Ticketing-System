apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-system-notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticketing-system-notification
  template:
    metadata:
      labels:
        app: ticketing-system-notification
    spec:
      containers:
        - name: notification
          image: notification:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: ticketing-system-credentials
            - configMapRef:
                name: ticketing-system-config
          # Notification is a worker that polls Redis, not an HTTP server.
          # probe ensures container starts and stays alive rather than testing TCP socket.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - "[ -e /tmp ]" # simple always-true test for startup readiness
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "[ -e /tmp ]" # maintain running health for this worker
            initialDelaySeconds: 30
            periodSeconds: 30
