{{- if .Values.keda.enabled }}
{{- range $key, $trigger := .Values.keda.trigger }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "ticketing-system.fullname" . }}-{{ $key }}-scaledobject
spec:
  scaleTargetRef:
    name: {{ include "ticketing-system.fullname" . }}-{{ $key | lower | replace "_" "-" }}
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 30
  triggers:
    - type: redis
      metadata:
        address: {{ .Values.global.redis.host }}:{{ .Values.global.redis.port }}
        listName: {{ $trigger.listName }}
        listLength: {{ $trigger.listLength }}
{{- end }}
{{- end }}