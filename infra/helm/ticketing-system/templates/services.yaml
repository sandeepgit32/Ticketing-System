{{- range $name, $cfg := .Values.services -}}
{{- if $cfg.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ticketing-system.fullname" $. }}-{{ $name }}
spec:
  type: {{ default "ClusterIP" $cfg.serviceType }}
  ports:
    - port: {{ $cfg.port }}
      targetPort: {{ $cfg.port }}
      protocol: TCP
      name: http
      {{- if $cfg.nodePort }}
      nodePort: {{ $cfg.nodePort }}
      {{- end }}
  selector:
    app: {{ include "ticketing-system.fullname" $. }}-{{ $name }}
---
{{- end }}
{{- end }}