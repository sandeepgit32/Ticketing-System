version: '3.8'
services:
  database:
    build: ./services/database
    env_file: ./services/database/.env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  auth:
    build: ./services/auth
    depends_on:
      database:
        condition: service_healthy
    env_file: ./services/auth/.env
    ports:
      - "8002:8000"

  booking-status:
    build: ./services/booking-status
    depends_on:
      database:
        condition: service_healthy
      auth:
        condition: service_started
    env_file: ./services/booking-status/.env
    ports:
      - "8003:8000"

  booking:
    build: ./services/booking
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./services/booking/.env
    ports:
      - "8001:8000"

  payment-mock:
    build: ./services/payment/mock
    depends_on:
      - redis
    env_file: ./services/payment/mock/.env
    ports:
      - "9001:9000"

  notification:
    build: ./services/notification
    depends_on:
      - redis
    env_file: ./services/notification/.env

  gateway:
    build: ./services/gateway
    depends_on:
      - auth
      - booking
      - booking-status
      - payment-mock
    env_file: ./services/gateway/.env
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend/vue
    depends_on:
      - gateway
    ports:
      - "5174:5173"
    environment:
      - VITE_BACKEND_URL=http://gateway:8000
    # VITE_BACKEND_URL is intentionally kept inline — it can vary per deploy target (local vs staging vs prod)

volumes:
  mysql_data:
