version: '3.8'
services:
  database:
    build: ./services/database
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=ticketing
      - MYSQL_USER=ticketuser
      - MYSQL_PASSWORD=ticketpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  auth:
    build: ./services/auth
    depends_on:
      database:
        condition: service_healthy
    environment:
      - MYSQL_HOST=database
      - MYSQL_PORT=3306
      - MYSQL_USER=ticketuser
      - MYSQL_PASSWORD=ticketpass
      - MYSQL_DATABASE=ticketing
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    ports:
      - "8002:8000"

  booking-status:
    build: ./services/booking-status
    depends_on:
      database:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      - MYSQL_HOST=database
      - MYSQL_PORT=3306
      - MYSQL_USER=ticketuser
      - MYSQL_PASSWORD=ticketpass
      - MYSQL_DATABASE=ticketing
      - AUTH_SERVICE_URL=http://auth:8000
    ports:
      - "8003:8000"

  booking:
    build: ./services/booking
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MYSQL_HOST=database
      - MYSQL_PORT=3306
      - MYSQL_USER=ticketuser
      - MYSQL_PASSWORD=ticketpass
      - MYSQL_DATABASE=ticketing
    ports:
      - "8001:8000"

  payment-mock:
    build: ./services/payment/mock
    depends_on:
      - redis
    ports:
      - "9001:9000"

  notification:
    build: ./services/notification
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=sandbox.smtp.mailtrap.io
      - SMTP_PORT=2525
      - SMTP_USER=${MAILTRAP_USER:-}
      - SMTP_PASSWORD=${MAILTRAP_PASSWORD:-}
      - FROM_EMAIL=noreply@ticketing-system.com

  gateway:
    build: ./services/gateway
    depends_on:
      - auth
      - booking
      - booking-status
      - payment-mock
    environment:
      - AUTH_SERVICE_URL=http://auth:8000
      - BOOKING_SERVICE_URL=http://booking:8000
      - BOOKING_STATUS_SERVICE_URL=http://booking-status:8000
      - PAYMENT_SERVICE_URL=http://payment-mock:9000
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend/vue
    depends_on:
      - gateway
    ports:
      - "5174:5173"
    environment:
      - VITE_BACKEND_URL=http://gateway:8000

volumes:
  mysql_data:
